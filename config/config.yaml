gpio:
  led:
    temperature:
      low_pin: 19
      medium_pin: 13
      high_pin: 6
      medium_threshold: 25.0
      high_threshold: 30.0
    humidity:
      low_pin: 22
      medium_pin: 27
      high_pin: 17
      medium_threshold: 40.0
      high_threshold: 60.0
  rgb_led:
    system:
      red_pin: 25
      green_pin: 24
      blue_pin: 23
  button:
    lighting_override_pin: 21
    lighting_brightness_pin: 20
    lighting_pattern_pin: 16
  pir:
    pin: 12
  dht11:
    pin: 26

lcd:
  i2c_address: 0x27

system:
  presence_timeout_secs: 300
  default_brightness: 100
  brightness_levels: [25, 50, 75, 100]
  default_pattern_index: 0

# Lighting Patterns Configuration
# Cycle through these patterns with the pattern button
lighting_patterns:
  # EventDriven: Responds to motion/presence (green=normal, blue=motion detected)
  - type: EventDriven

  # Static: Single solid color
  - type: Static
    color: { red: 100, green: 3, blue: 0 }  # Warm orange

  # Gradient: Smooth alternation between two colors
  - type: Gradient
    color1: { red: 100, green: 0, blue: 0 }    # Red
    color2: { red: 100, green: 5, blue: 0 }   # Orange
    interval_secs: 5

  # Rainbow: Full spectrum cycle
  - type: Rainbow
    cycle_secs: 20
    steps: 100

  # Pulse: Breathing effect with a single color
  - type: Pulse
    color: { red: 0, green: 90, blue: 100 }   # Cyan
    period_secs: 4
    min_brightness: 20
    max_brightness: 100

  # ColorCycle: Cycle through predefined colors
  - type: ColorCycle
    colors:
      - { red: 100, green: 0, blue: 0 }        # Red
      - { red: 100, green: 50, blue: 0 }       # Orange
      - { red: 100, green: 100, blue: 0 }      # Yellow
      - { red: 0, green: 100, blue: 0 }        # Green
      - { red: 0, green: 100, blue: 100 }      # Cyan
      - { red: 0, green: 0, blue: 100 }        # Blue
      - { red: 100, green: 0, blue: 100 }      # Magenta
    interval_secs: 3
